<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chevy EV Concepts</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .metallic-container {
            background: linear-gradient(145deg, #2d343f, #1a1a2e);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 
                0 20px 40px rgba(0, 0, 0, 0.5),
                inset 0 2px 4px rgba(255, 255, 255, 0.1),
                inset 0 -2px 4px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 25px;
            max-width: 1200px;
            margin: 20px;
        }
        
        .image-card {
            background: linear-gradient(145deg, #2d343f, #1e2328);
            border-radius: 15px;
            padding: 20px;
            box-shadow: 
                0 10px 25px rgba(0, 0, 0, 0.4),
                inset 0 1px 2px rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        
        .image-card:hover {
            transform: translateY(-5px);
            box-shadow: 
                0 15px 35px rgba(0, 0, 0, 0.5),
                0 0 20px rgba(255, 255, 255, 0.1);
        }
        
        .image-card img {
            width: 100%;
            height: auto;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }
        
        .image-card h3 {
            color: #dfe6e9;
            text-align: center;
            margin: 15px 0 10px;
            font-weight: 500;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
        }
        
        .title {
            text-align: center;
            color: #dfe6e9;
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
            background: linear-gradient(90deg, #74b9ff, #0984e3, #74b9ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .subtitle {
            text-align: center;
            color: #b2bec3;
            margin-bottom: 30px;
            font-size: 1.1em;
        }
    </style>
</head>
<body>
    <div class="metallic-container">
        <h1 class="title">Chevy EV Concepts</h1>
        <p class="subtitle">Future Electric Vehicle Prototypes</p>
        
        <div class="gallery">
            <div class="image-card">
                <img src="https://raw.githubusercontent.com/packgit/chevyitems1/main/chevy-bolt-urban-concept---cdbe81fa-b5a1-4b9a-a349-3cc1b4408bd8.jpg" alt="Chevy Bolt Urban Concept">
                <h3>Chevy Bolt - Urban Concept</h3>
            </div>
            
            <div class="image-card">
                <img src="https://raw.githubusercontent.com/packgit/chevyitems1/main/chevy-corvette-sports-final---5e232bb2-4bf6-4e42-8abe-09bde5245920.png" alt="Chevy Corvette Sports">
                <h3>Chevy Corvette - Luxury Sports</h3>
            </div>
        </div>
    </div>
</body>
</html>
